name: ARX Rank Tracker

on:
  schedule:
    # 매일 UTC 00:00 = 한국시간(KST) 오전 9시
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run rank check
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/track.py

      - name: Commit updated data & dashboard
        run: |
          git config user.name "arx-rank-bot"
          git config user.email "actions@github.com"
          git add data/history.json index.html
          git diff --staged --quiet || git commit -m "chore: 순위 데이터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
